apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: pod-reader}
rules: [{apiGroups: [""], resources: [pods], verbs: [get, list, watch]}]
---
apiVersion: k8s.pliu.dev/v1alpha1
kind: ManagedNamespace
metadata: {name: team-a}
spec:
  labels:
    owner: platform-team
  annotations:
    example.com/contact: platform@example.com
  resourceQuotas:
    - name: compute
      hard:
        pods: "50"
        requests.cpu: "10"
        requests.memory: 20Gi
    - name: low-priority
      hard:
        pods: "10"
      scopeSelector:
        matchExpressions:
          - scopeName: PriorityClass
            operator: In
            values: [low]
  accessMappings:
    - group: 6f9619ff-8b86-d011-b42d-00c04fc964ff
      clusterRoles: [pod-reader]
    - users: [alice@example.com, bob@example.com]
      clusterRoles: [pod-reader]
---
apiVersion: k8s.pliu.dev/v1alpha1
kind: ClusterAccessMapping
metadata: {name: cluster-pod-readers}
spec:
  group: 6f9619ff-8b86-d011-b42d-00c04fc964ff
  clusterRoles: [pod-reader]
