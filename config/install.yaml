apiVersion: v1
kind: Namespace
metadata: {name: k8s-controller, labels: {app.kubernetes.io/managed-by: k8s-controller}}
---
apiVersion: v1
kind: ServiceAccount
metadata: {name: k8s-controller, namespace: k8s-controller}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: {name: k8s-controller}
rules:
- apiGroups: [""]
  resources: [namespaces]
  verbs: [get, list, watch, create, update, patch]
- apiGroups: [""]
  resources: [resourcequotas]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [k8s.pliu.dev]
  resources: [managednamespaces, clusteraccessmappings]
  verbs: [get, list, watch, update, patch]
- apiGroups: [k8s.pliu.dev]
  resources: [managednamespaces/status, clusteraccessmappings/status]
  verbs: [get, update, patch]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [clusterroles]
  verbs: [get, list, watch, bind]
- apiGroups: [rbac.authorization.k8s.io]
  resources: [rolebindings, clusterrolebindings]
  verbs: [get, list, watch, create, update, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: {name: k8s-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: k8s-controller}
subjects: [{kind: ServiceAccount, name: k8s-controller, namespace: k8s-controller}]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: k8s-controller-leader-election, namespace: k8s-controller}
rules:
- apiGroups: [coordination.k8s.io]
  resources: [leases]
  verbs: [get, list, watch, create, update, patch, delete]
- apiGroups: [""]
  resources: [events]
  verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: k8s-controller-leader-election, namespace: k8s-controller}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: k8s-controller-leader-election}
subjects: [{kind: ServiceAccount, name: k8s-controller, namespace: k8s-controller}]
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: k8s-controller, namespace: k8s-controller}
spec:
  replicas: 3
  selector: {matchLabels: {app: k8s-controller}}
  template:
    metadata: {labels: {app: k8s-controller, app.kubernetes.io/managed-by: k8s-controller}}
    spec:
      serviceAccountName: k8s-controller
      securityContext: {runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
      containers:
      - name: k8s-controller
        image: ghcr.io/pliu/k8s-controller:latest
        imagePullPolicy: IfNotPresent
        command: [/k8s-controller]
        ports: [{name: http, containerPort: 8080}, {name: health, containerPort: 8081}]
        readinessProbe: {httpGet: {path: /readyz, port: health}, initialDelaySeconds: 2}
        livenessProbe: {httpGet: {path: /healthz, port: health}, initialDelaySeconds: 10}
        resources: {requests: {cpu: 50m, memory: 64Mi}, limits: {cpu: 500m, memory: 256Mi}}
        securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
---
apiVersion: v1
kind: Service
metadata: {name: k8s-controller, namespace: k8s-controller}
spec: {selector: {app: k8s-controller}, ports: [{port: 80, targetPort: http}]}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: k8s-controller, namespace: k8s-controller}
spec: {minAvailable: 2, selector: {matchLabels: {app: k8s-controller}}}
